<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chrome attribution fixture</title>
<style>
  html { overflow-x: hidden; }
  body { margin: 0; font-family: Arial, sans-serif; }
  section.slide { position: relative; display: block; width: 1280px; height: 720px; margin: 0; background: #ffffff; }
  .abs { position: absolute; margin: 0; font-size: 32px; line-height: 1.3; }
</style>
</head>
<body>

<!-- 1: solid chrome band (#d9d9d9) with a SIBLING content text (#8a8a8a, about 2.4:1) -->
<section class="slide">
  <div data-tpl="chrome" data-role="chrome" style="position:absolute;left:0;top:260px;width:1280px;height:200px;background:#d9d9d9"></div>
  <p class="abs" style="left:100px;top:330px;width:900px;color:#8a8a8a">Low contrast content text</p>
</section>

<!-- 2: chrome picture covering the slide with a sibling content text -->
<section class="slide">
  <img data-tpl="chrome" data-role="chrome" src="images/sample.png" alt="" style="position:absolute;left:0;top:0;width:1280px;height:720px">
  <p class="abs" style="left:100px;top:320px;width:900px;color:#ffffff">Content text over a picture</p>
</section>

<!-- 3: chrome text (#dddddd on white, about 1.4:1) and a normal sibling content text that does not overlap it -->
<section class="slide">
  <p class="abs" data-tpl="chrome" data-role="chrome" style="left:100px;top:120px;width:900px;color:#dddddd">Faint decoration text</p>
  <p class="abs" style="left:100px;top:420px;width:900px;color:#222222">Normal readable content text</p>
</section>

</body>
</html>
